<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forum StudyWithMe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 8px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #90cdf4; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #63b3ed; }
      
      body { font-family: 'Be Vietnam Pro', sans-serif; }
      .font-header { font-family: 'Nunito', sans-serif; }
      .font-bungee { font-family: 'Bungee', cursive; }

      /* --- OCEAN BACKGROUND ASSETS --- */
      .pixel-dolphin-base { position: absolute; width: 8px; height: 8px; background: transparent; color: #95a5a6; opacity: 1; box-shadow: 8px 0, 16px 0, 24px 0, 32px 0, 40px 0, 0px 8px, 8px 8px, 16px 8px, 24px 8px, 32px 8px, 40px 8px, 48px 8px, 8px 16px #bdc3c7, 16px 16px #bdc3c7, 24px 16px #bdc3c7, 32px 16px #bdc3c7, 40px 16px #bdc3c7, 24px -8px #7f8c8d, 32px -8px #7f8c8d, 16px 16px #7f8c8d, 16px 24px #7f8c8d, 56px 8px, 64px 0, 64px 16px; }
      .pixel-whale { position: absolute; width: 10px; height: 10px; background: transparent; color: #34495e; box-shadow: 20px 0, 30px 0, 40px 0, 50px 0, 60px 0, 70px 0, 10px 10px, 20px 10px, 30px 10px, 40px 10px, 50px 10px, 60px 10px, 70px 10px, 80px 10px, 0px 20px, 10px 20px, 20px 20px, 30px 20px, 40px 20px, 50px 20px, 60px 20px, 70px 20px, 80px 20px, 90px 20px, 10px 30px #ecf0f1, 20px 30px #ecf0f1, 30px 30px #ecf0f1, 40px 30px #ecf0f1, 50px 30px #ecf0f1, 60px 30px #ecf0f1, 70px 30px #ecf0f1, 100px 10px, 110px 0, 110px 20px; }
      .pixel-starfish { position: absolute; width: 5px; height: 5px; background: transparent; color: #e74c3c; box-shadow: 10px 0, 5px 5px, 10px 5px, 15px 5px, 0px 10px, 5px 10px, 10px 10px, 15px 10px, 20px 10px, 5px 15px, 15px 15px, 0px 20px, 20px 20px; animation: rotateStar 8s linear infinite; }
      @keyframes rotateStar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      
      .swim-left { animation: swimLeft linear infinite; transform: scale(3); } 
      .swim-left-whale { animation: swimLeft linear infinite; transform: scale(4); }
      .swim-right { animation: swimRight linear infinite; } 
      .swim-right-whale { animation: swimRightWhale linear infinite; }
      
      @keyframes swimLeft { from { left: 110%; } to { left: -30%; } }
      @keyframes swimRight { from { left: -30%; transform: scaleX(-1) scaleY(1) scale(3); } to { left: 110%; transform: scaleX(-1) scaleY(1) scale(3); } }
      @keyframes swimRightWhale { from { left: -30%; transform: scaleX(-1) scaleY(1) scale(4); } to { left: 110%; transform: scaleX(-1) scaleY(1) scale(4); } }
      
      .tiny-bubble { position: absolute; width: 3px; height: 3px; background: rgba(255,255,255,0.6); animation: bubbleRise linear infinite; }
      @keyframes bubbleRise { from { bottom: -10px; } to { bottom: 110%; } }

      /* --- FRAME STYLES (Pure CSS) --- */
      .frame-content { border-radius: 50%; width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 10; }

      /* F1: Ice */
      .frame-ice { position: absolute; inset: -5px; border-radius: 50%; z-index: 20; pointer-events: none; border: 4px solid #a5f3fc; box-shadow: 0 0 10px #22d3ee, inset 0 0 10px #22d3ee; animation: pulse-ice 3s infinite; }
      @keyframes pulse-ice { 0%, 100% { box-shadow: 0 0 10px #22d3ee; } 50% { box-shadow: 0 0 20px #67e8f9; } }

      /* F2: Fire */
      .frame-fire { position: absolute; inset: -4px; border-radius: 50%; z-index: 20; pointer-events: none; border: 4px solid #fca5a5; border-top-color: #ef4444; border-bottom-color: #f87171; box-shadow: 0 0 15px #ef4444; animation: spin-fire 4s linear infinite; }
      @keyframes spin-fire { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      /* F3: Tech */
      .frame-tech { position: absolute; inset: -6px; border-radius: 50%; z-index: 20; pointer-events: none; border: 2px dashed #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); animation: spin-tech 10s linear infinite; }
      .frame-tech::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent; border-top-color: #818cf8; border-bottom-color: #818cf8; animation: spin-tech-reverse 5s linear infinite; }
      @keyframes spin-tech { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spin-tech-reverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

      /* F4: Nature */
      .frame-nature { position: absolute; inset: -4px; border-radius: 50%; z-index: 20; pointer-events: none; border: 4px solid #34d399; box-shadow: 0 4px 0 #059669; }
      .frame-nature::before { content: '🌿'; position: absolute; bottom: -5px; right: -5px; font-size: 16px; animation: bounce-slow 3s infinite; }

      /* F5: Gold */
      .frame-gold { position: absolute; inset: -6px; border-radius: 50%; z-index: 20; pointer-events: none; border: 4px double #facc15; box-shadow: 0 0 15px rgba(250, 204, 21, 0.6); background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.8), transparent 50%); }

      /* F6: Neon Cyber */
      .frame-neon { position: absolute; inset: -4px; border-radius: 50%; z-index: 20; pointer-events: none; border: 3px solid #d946ef; border-left-color: #06b6d4; box-shadow: 0 0 10px #d946ef, 0 0 10px #06b6d4; animation: spin-neon 2s linear infinite; }
      @keyframes spin-neon { 0% { transform: rotate(0deg); filter: hue-rotate(0deg); } 100% { transform: rotate(360deg); filter: hue-rotate(360deg); } }

      /* F7: Galaxy */
      .frame-galaxy { position: absolute; inset: -5px; border-radius: 50%; z-index: 20; pointer-events: none; background: conic-gradient(from 0deg, #4c1d95, #c026d3, #4c1d95); padding: 3px; -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin-slow 10s linear infinite; }
      .frame-galaxy::before { content: '✨'; position: absolute; top: 0; left: 50%; font-size: 10px; animation: twinkle 1s infinite; }
      
      /* F8: Pixel Art */
      .frame-pixel { position: absolute; inset: -6px; z-index: 20; pointer-events: none; box-shadow: 2px 0 0 #000, -2px 0 0 #000, 0 -2px 0 #000, 0 2px 0 #000, 4px 0 0 #000, -4px 0 0 #000, 0 -4px 0 #000, 0 4px 0 #000, 0 0 0 4px #fff; border-radius: 10%; }

      /* F9: Sakura */
      .frame-sakura { position: absolute; inset: -4px; border-radius: 50%; z-index: 20; pointer-events: none; border: 3px solid #fbcfe8; box-shadow: 0 0 8px #f472b6; }
      .frame-sakura::after { content: '🌸'; position: absolute; top: -5px; right: -5px; animation: spin-slow 8s infinite; }
      .frame-sakura::before { content: '🌸'; position: absolute; bottom: -5px; left: -5px; font-size: 10px; animation: spin-reverse 8s infinite; }

      /* F10: Royal */
      .frame-royal { position: absolute; inset: -5px; border-radius: 50%; z-index: 20; pointer-events: none; border: 3px solid #eab308; box-shadow: 0 0 0 2px #713f12 inset; }
      .frame-royal::before { content: '👑'; position: absolute; top: -14px; left: 50%; transform: translateX(-50%) rotate(-10deg); font-size: 18px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }

      /* Global Animations */
      @keyframes snowFall { 0% { transform: translateY(-10vh) translateX(0); opacity: 1; } 100% { transform: translateY(110vh) translateX(20px); opacity: 0; } }
      @keyframes cityScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      
      .animate-pop-in { animation: pop-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      @keyframes pop-in { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
      @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spin-reverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes bounce-slow { 0%, 100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
      @keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.5); } }

      .animate-spin-slow { animation: spin-slow 10s linear infinite; }
      
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",

    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>

</head>

    <div id="root"></div>

</html>
